<main class="login">
  <section class="login__panel">
    <div class="login__brand">
      <p class="section__label">Área de acesso</p>
      <a class="login__logo" routerLink="/home">Atlas</a>
      <h1>Entrar</h1>
      <p class="login__subtitle">Acesso visual para iniciar a navegação do site.</p>
    </div>

    <div class="login__form">
      <div class="form-field">
        <label for="username">Usuário</label>
        <input id="username" type="text" autocomplete="username" placeholder="Digite seu usuário" />
      </div>

      <div class="form-field">
        <label for="password">Senha</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" />
      </div>

      <a class="btn btn--primary login__submit" routerLink="/home">Entrar</a>
    </div>

  </section>
</main>
