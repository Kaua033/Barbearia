# ─────────────────────────────────────────────────────────────
# CONFIGURAÇÃO DE TESTE
# ─────────────────────────────────────────────────────────────
# Usamos H2 em modo PostgreSQL para os testes rodarem
# sem precisar de um banco PostgreSQL real.
# O H2 emula o comportamento do PostgreSQL o suficiente
# para validar a lógica JPA e as queries.
# ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Cria e destroi as tabelas a cada teste (isolamento)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Desabilita Flyway nos testes (usamos ddl-auto=create-drop)
spring.flyway.enabled=false
