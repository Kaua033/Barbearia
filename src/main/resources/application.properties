spring.application.name=Barbearia


# JPA / Hibernate
spring.jpa.properties.hibernate.format_sql=true

# ───────── Banco de dados PostgreSQL ─────────
#
# As credenciais são carregadas exclusivamente por meio de variáveis de
# ambiente (ou do arquivo .env local que é ignorado pelo git).
# NÃO coloque aqui senhas ou usuários reais:
#   - DB_URL       (ex: jdbc:postgresql://localhost:5432/barbearia)
#   - DB_USERNAME  (ex: barbearia)
#   - DB_PASSWORD  (ex: ********)
#
# Motivo: expor credenciais em texto claro no repositório é uma
# vulnerabilidade detectada em auditoria (score de risco 49).
# ─────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.flyway.enabled=false